name: codecov.io

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codecov:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e #v7.0.0
        with:
          go-version-file: go.mod

      - name: Connect to Tailnet
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd #v4.2.0
        with:
          args: --accept-dns=true
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-runner
          version: latest

      - name: Runing tests for coverage
        run: |
          go test -race -coverprofile=coverage.out -covermode=atomic `go list ./... | grep -v vendor/` -v

      - name: Uploading coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 #v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: TibiaData/tibiadata-api-go
